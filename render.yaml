services:
  - type: web
    name: catatin-python-ai
    runtime: python
    plan: free
    buildCommand: pip install -r ai/requirements.txt
    startCommand: uvicorn ai.api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_SHARED_SECRET
        generateValue: true
